name: Java CI-CD with Gradle and Azure

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
        distribution: 'adopt'
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew shadowJar
    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build-jars
        path: |
          build/libs
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set image tag
      run: |
        IMAGE_TAG=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')
        [[ "${{ github.ref }}" == "refs/tags/"* ]] && IMAGE_TAG=$(echo $VERSION | sed -e 's/^v//')
        [ "IMAGE_TAG" == "main" ] && VERSION=latest
        echo "IMAGE_NAME=${GITHUB_REPOSITORY##*/}" >> "$GITHUB_ENV"
        echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
        echo "Image: $IMAGE_NAME:$IMAGE_TAG"
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
    - uses: feavy/deploy@main
      env:
        DEPLOYMENT: remibot
        NAMESPACE: feavy
        BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        FILE_PATH: "kubernetes/apps/remibot/release.yaml"
        YAML_PATH: ".spec.values.apps.remibot.image.tag"
        REF: "${{ github.ref_name }}"
        TAG: "${{ env.IMAGE_TAG }}"

